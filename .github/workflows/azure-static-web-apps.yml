name: Deploy web to Azure Static Web Apps

on:
  push:
    branches: ["99%"]
    paths: ["client/**", "package.json", "package-lock.json", ".github/workflows/azure-static-web-apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:client
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_AUTH_TRANSPORT: bearer
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: client/dist
          skip_app_build: true
