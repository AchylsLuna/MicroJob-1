name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Mobile/package-lock.json

      - name: Install web and API dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix Mobile

      - name: Enforce security policy
        run: npm run check:security

      - name: Verify application
        run: npm run verify

      # The e2e suite starts its own API and client (see playwright.config.ts
      # and scripts/start-e2e-*.cjs), so it needs no service wiring here -- only
      # the browsers, which are not part of npm ci.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
